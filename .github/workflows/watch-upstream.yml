# Opens a pull request when the upstream repo gets ahead of this fork.
#
# Upstream is someone else's repo, so its commits are deliberately NOT merged
# automatically - they would reach courses.biopc.org unreviewed. But leaving the
# check entirely manual meant a changed WhatsApp group link sat unnoticed for a
# month while the site kept serving the old one.
#
# So: this watches, and tells you. You still decide, by merging the PR or not.
name: Watch upstream

on:
  schedule:
    # 02:30 UTC daily - half an hour before the site sync, so a PR merged in the
    # morning is picked up by that same day's sync.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: watch-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/md-mustak-khan/Bioinformatics_Research_Internship.git
  SYNC_BRANCH: upstream-sync

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM" 2>/dev/null || git remote set-url upstream "$UPSTREAM"
          git fetch --quiet upstream main

      - name: Open or update a PR if upstream has moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "Up to date with upstream - nothing to do."
            exit 0
          fi
          echo "Upstream is $BEHIND commit(s) ahead."

          # Will the merge apply cleanly? Reported in the PR so you know before
          # you click, rather than after.
          if git merge-tree --write-tree HEAD upstream/main >/dev/null 2>&1; then
            MERGE_NOTE="This merges cleanly."
          else
            MERGE_NOTE="**This does not merge cleanly** - expect conflicts. Keep your canonical and og:url lines, and take upstream's for everything else."
          fi

          # Point the sync branch at upstream so the PR shows exactly what is new.
          git push --force origin refs/remotes/upstream/main:refs/heads/${SYNC_BRANCH}

          {
            echo "Upstream is **${BEHIND} commit(s) ahead** of this fork."
            echo
            echo "$MERGE_NOTE"
            echo
            echo "### New commits"
            git log --reverse --format='- \`%h\` %ad %s' --date=short HEAD..upstream/main
            echo
            echo "### Files changed"
            echo '```'
            # Three dots: diff from the merge base, so this lists only what
            # upstream changed. Two dots compares branch tips and would show
            # this fork's own commits as though upstream were reverting them.
            git diff --stat HEAD...upstream/main
            echo '```'
            echo
            echo "### Before merging, check"
            echo "- \`image/Hridoy Ahmed.jpg\` - if the file list above touches it, upstream is changing the portrait"
            echo "- the canonical / \`og:url\` lines - keep this fork's, which point at courses.biopc.org"
            echo "- that no \`<base>\` tag is added here; it is injected during the site sync and breaks GitHub Pages if stored in the source"
            echo
            echo "Merging this PR is all that is needed. The site sync runs daily at 02:00 UTC and will carry it to courses.biopc.org, or trigger it by hand from the biopc-r-landing repo."
          } > /tmp/pr-body.md

          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md
            echo "Updated existing PR #${EXISTING}."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "${SYNC_BRANCH}" \
              --title "Sync ${BEHIND} commit(s) from upstream" \
              --body-file /tmp/pr-body.md
            echo "Opened a new PR."
          fi
